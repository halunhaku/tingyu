<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>听屿 · P1 三方向视觉评审</title>
<style>
:root{font-family:system-ui,'Microsoft YaHei',sans-serif;color:#22252b;background:#f5f5f7;line-height:1.6}*{box-sizing:border-box}body{margin:0}header,main,footer{max-width:1600px;margin:auto;padding:24px}h1{font-size:30px;margin:0}h2{font-size:22px;margin:0}p{margin:8px 0 18px;color:#555b66}a{color:#284a6d}nav{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}button{font:inherit;padding:10px 16px;min-height:44px;border:1px solid #b7bdc6;border-radius:6px;cursor:pointer;background:white;color:#22252b}button[aria-pressed=true]{background:#263648;color:white;border-color:#263648}button:focus-visible,a:focus-visible{outline:3px solid #466c9b;outline-offset:4px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}article{background:white;padding:20px;border:1px solid #dddfe5;border-radius:8px;min-width:0}.tag{font-size:12px;letter-spacing:.08em;color:#69717d}.description{min-height:54px;font-size:14px}figure{margin:0}figure[hidden]{display:none}figure a{display:block}figure img{display:block;width:100%;height:auto;background:#eee}figure.mobile img{max-width:390px;margin:auto}figcaption{font-size:13px;margin:10px 0;color:#5d6570}.palette{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;margin-top:12px}.swatch{display:inline-flex;align-items:center;gap:6px}.swatch i{width:18px;height:18px;display:inline-block;border:1px solid #aaa}.detail{font-size:14px;margin-top:16px;border-top:1px solid #e3e5ea;padding-top:12px}summary{cursor:pointer;min-height:44px;padding:8px 0}.notice{border-left:3px solid #718299;padding:10px 14px;background:#fff}.links{display:flex;gap:18px;flex-wrap:wrap}footer{font-size:13px;color:#5d6570}@media(max-width:950px){.grid{grid-template-columns:1fr}header,main,footer{padding:18px}.description{min-height:0}}
</style>
<header><div class="tag">TINGYU / DESIGN EXPLORATION / 2026-10-18</div><h1>同一座曲库，三种聆听方式</h1><p>C「声档」方向已选定，保留三套原图供追溯。点击图片打开原图；切换场景可同时比较。</p><div class="notice">已选 C「声档」。P2 深色、手机布局与舞台尺寸细节待确认。本页是视觉稿评审目录，画面内播放器控件不可交互，尚未实施 Flutter 页面。</div><nav aria-label="对比场景"><button data-view="desktop-library" aria-pressed="true">桌面 · 曲库</button><button data-view="desktop-player" aria-pressed="false">桌面 · 播放</button><button data-view="mobile-library" aria-pressed="false">手机 · 曲库</button><button data-view="mobile-player" aria-pressed="false">手机 · 播放</button></nav><div class="links"><a href="../02-design-system.md">P2 设计系统</a><a href="../01-directions.md">方案说明</a><a href="../01-visual-review.md">审查记录</a><a href="generation-prompts.json">生成源提示</a></div></header>
<main class="grid" id="gallery"></main>
<footer>桌面逻辑目标 1440×900；手机逻辑目标 390×844。原图为 1586×992、853×1844，保持自然比例展示。C 方向已确认；精确规格及 Golden 更新尚未批准。</footer>
<script>
const directions=[
{id:'a',title:'A · 静屿',description:'暖白与苔绿；桌面封面书架与歌曲列表，手机单列，播放页侧重安静歌词。',light:['#F8F7F3','#202322','#426457'],dark:['#171C19','#F1F2EB','#A9C5AE'],detail:'优势：音乐内容与清楚的文字层级。取舍：封面书架占用桌面列表空间。浅色主稿；深色为配色候选，尚无完整页面稿。'},
{id:'b',title:'B · 夜航',description:'深海蓝与青蓝；桌面、手机均以专辑封面浏览为主，舞台保留歌词焦点。',light:['#F3F7FB','#152638','#24697A'],dark:['#101827','#EFF3FA','#63CCD9'],detail:'优势：封面与播放氛围连续。取舍：深色次级文字、背景变化及动效需要严格验证。深色主稿；浅色为配色候选。'},
{id:'c',title:'C · 声档（已选）',description:'纸白与琥珀；桌面来源列、手机来源筛选，播放时区分当前与接下来。',light:['#FAFAFC','#18191D','#9A5D09'],dark:['#191A1E','#F4F4F6','#E3B56B'],detail:'已选方向。手机筛选与弹性行高、Dark 与舞台尺寸的精确提案见 P2；尚未改动 Flutter。'}];
const scenes={'desktop-library':'桌面 · 曲库','desktop-player':'桌面 · 播放','mobile-library':'手机 · 曲库','mobile-player':'手机 · 播放'};
const gallery=document.getElementById('gallery');
for(const d of directions){const article=document.createElement('article');const title=document.createElement('h2');title.textContent=d.title;article.append(title);const desc=document.createElement('p');desc.className='description';desc.textContent=d.description;article.append(desc);for(const [scene,label]of Object.entries(scenes)){const fig=document.createElement('figure');fig.dataset.scene=scene;fig.hidden=scene!=='desktop-library';if(scene.startsWith('mobile'))fig.className='mobile';const a=document.createElement('a');a.href=`${d.id}/${scene}.png`;a.target='_blank';a.rel='noopener';const img=document.createElement('img');img.src=a.href;img.alt=`${d.title} ${label} 未批准概念视觉稿`;a.append(img);fig.append(a);const caption=document.createElement('figcaption');caption.textContent=label+' · 点击查看原图';fig.append(caption);article.append(fig);}for(const mode of ['light','dark']){const palette=document.createElement('div');palette.className='palette';palette.append(mode==='light'?'Light 候选：':'Dark 候选：');for(const color of d[mode]){const span=document.createElement('span');span.className='swatch';const swatch=document.createElement('i');swatch.style.background=color;span.append(swatch,color);palette.append(span);}article.append(palette);}const detail=document.createElement('details');detail.className='detail';const summary=document.createElement('summary');summary.textContent='设计取舍与边界';detail.append(summary,d.detail);article.append(detail);gallery.append(article);}
document.querySelectorAll('button[data-view]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('button[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelectorAll('figure[data-scene]').forEach(f=>f.hidden=f.dataset.scene!==button.dataset.view);}));
</script>
</html>
