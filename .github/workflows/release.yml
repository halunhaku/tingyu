name: Sign and publish local release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft Release tag produced by the local release script
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  sign-and-publish:
    name: Sign Android APK and publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Validate draft release assets
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          VERSION="${RELEASE_TAG#v}"
          IS_DRAFT="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
          if [[ "$IS_DRAFT" != "true" ]]; then
            echo "Release $RELEASE_TAG must exist and remain a draft" >&2
            exit 1
          fi

          UNSIGNED_APK="Tingyu_${VERSION}_android_arm64_unsigned.apk"
          SIGNED_APK="Tingyu_${VERSION}_android_arm64.apk"
          APP_ARCHIVE="Tingyu_${VERSION}_aarch64.app.tar.gz"
          DMG="Tingyu_${VERSION}_aarch64.dmg"
          ASSETS="$(gh release view "$RELEASE_TAG" --json assets --jq '[.assets[].name]')"

          if jq -e --arg name "$UNSIGNED_APK" 'index($name) != null' <<<"$ASSETS" >/dev/null; then
            echo "needs_signing=true" >> "$GITHUB_OUTPUT"
          elif jq -e --arg name "$SIGNED_APK" 'index($name) != null' <<<"$ASSETS" >/dev/null; then
            echo "needs_signing=false" >> "$GITHUB_OUTPUT"
          else
            echo "Neither unsigned nor signed Android APK exists in $RELEASE_TAG" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "unsigned_apk=$UNSIGNED_APK" >> "$GITHUB_OUTPUT"
          echo "signed_apk=$SIGNED_APK" >> "$GITHUB_OUTPUT"
          echo "app_archive=$APP_ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

      - name: Set up Android SDK
        if: steps.metadata.outputs.needs_signing == 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android signing tools
        if: steps.metadata.outputs.needs_signing == 'true'
        run: sdkmanager 'build-tools;36.0.0' >/dev/null

      - name: Download unsigned Android APK
        if: steps.metadata.outputs.needs_signing == 'true'
        env:
          UNSIGNED_APK: ${{ steps.metadata.outputs.unsigned_apk }}
        run: |
          mkdir -p android-release
          gh release download "$RELEASE_TAG" \
            --pattern "$UNSIGNED_APK" \
            --dir android-release

      - name: Sign Android APK
        if: steps.metadata.outputs.needs_signing == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          UNSIGNED_APK: ${{ steps.metadata.outputs.unsigned_apk }}
          SIGNED_APK: ${{ steps.metadata.outputs.signed_apk }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tingyu-release.jks"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/tingyu-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "android-release/$SIGNED_APK" \
            "android-release/$UNSIGNED_APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            "android-release/$SIGNED_APK"

      - name: Upload signed Android APK
        if: steps.metadata.outputs.needs_signing == 'true'
        env:
          SIGNED_APK: ${{ steps.metadata.outputs.signed_apk }}
        run: gh release upload "$RELEASE_TAG" "android-release/$SIGNED_APK" --clobber

      - name: Verify assets and publish Release
        env:
          UNSIGNED_APK: ${{ steps.metadata.outputs.unsigned_apk }}
          SIGNED_APK: ${{ steps.metadata.outputs.signed_apk }}
          APP_ARCHIVE: ${{ steps.metadata.outputs.app_archive }}
          DMG: ${{ steps.metadata.outputs.dmg }}
        run: |
          set -euo pipefail
          ASSETS="$(gh release view "$RELEASE_TAG" --json assets --jq '[.assets[].name]')"
          for REQUIRED_ASSET in "$APP_ARCHIVE" "$DMG" "$SIGNED_APK"; do
            if ! jq -e --arg name "$REQUIRED_ASSET" 'index($name) != null' <<<"$ASSETS" >/dev/null; then
              echo "Missing required release asset: $REQUIRED_ASSET" >&2
              exit 1
            fi
          done

          if jq -e --arg name "$UNSIGNED_APK" 'index($name) != null' <<<"$ASSETS" >/dev/null; then
            gh release delete-asset "$RELEASE_TAG" "$UNSIGNED_APK" --yes
          fi
          gh release edit "$RELEASE_TAG" --draft=false
