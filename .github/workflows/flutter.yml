name: Flutter

on:
  push:
    # 必须同时写 branches：GitHub 的规则是"只写 tags 不写 branches 时，
    # 分支推送不会触发这个 workflow"。此前只加了 tags，于是 main 上的每次推送
    # 都静默不跑 CI（Actions 里只剩 tag 推送与手动 dispatch），
    # 代码改动等于没有回归网。
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'app/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: app

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze + test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # media_kit / audio_service_mpris / flutter_secure_storage 在 Linux 上需要这些原生依赖才能解析与构建
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libmpv-dev libsecret-1-dev libayatana-appindicator3-dev \
            ninja-build libgtk-3-dev pkg-config
      - run: flutter pub get
      # drift 的 database.g.dart 是提交进仓库的；schema 改了却忘记重新生成，
      # 会在运行时才发现。这里用"重新生成后必须无 diff"来兜底。
      - name: Verify generated drift code is up to date
        run: |
          dart run build_runner build
          git diff --exit-code --stat
      - run: flutter analyze
      - run: flutter test

  build:
    name: build (${{ matrix.name }})
    needs: analyze
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos
            name: macos
            # 只收产物目录：`**/Release/**` 会把 Build/Intermediates 里的同名目录一起收进来（近 1GB）
            artifacts: app/build/macos/Build/Products/Release/**
          - os: macos-14
            target: ios
            name: ios
            # iOS 不支持 `--release` 的无签名构建产物分发；这里只验证"能编过"，
            # 上传的是未签名的 .app，不参与 GitHub Release。
            build_args: --no-codesign
            # 用 `**` 覆盖 `iphoneos/Runner.app` 与 `Release-iphoneos/Runner.app` 两种布局；
            # 这条路径无法在本机（Linux）验证，写窄了会让 CI 因找不到产物直接失败。
            artifacts: app/build/ios/**/Runner.app/**
          - os: windows-2022
            target: windows
            name: windows
            artifacts: app/build/windows/x64/runner/Release/**
          - os: ubuntu-22.04
            target: linux
            name: linux
            artifacts: app/build/linux/x64/release/bundle/**
          - os: ubuntu-22.04
            target: apk
            name: android
            artifacts: app/build/app/outputs/flutter-apk/app-release.apk
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 21
        if: matrix.target == 'apk'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux native dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libmpv-dev libsecret-1-dev libayatana-appindicator3-dev \
            ninja-build libgtk-3-dev pkg-config
      - run: flutter pub get
      # 运行期需要的凭据（Android 签名密钥）在 CI 里没有，所以 release job 只做
      # 未签名/调试签名的构建验证；正式分发用仓库 Secrets 走本地打包（见 README）。
      - name: Build
        run: flutter build ${{ matrix.target }} --release ${{ matrix.build_args }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tingyu-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # 发版正文取自附注 tag 的信息，需要完整的 tag 历史（用于自动定位上一个 tag）。
          fetch-depth: 0
      - name: Read tag notes as release body
        id: notes
        run: |
          # 自动生成的 release notes 只列合并进来的 PR；本仓库是直接推 main 的，
          # 生成出来只有一行 compare 链接。改用附注 tag 的信息作为正文，
          # 并自动补上"与上一个 tag 的对比"链接。
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")"
          {
            echo 'body<<TINGYU_NOTES_EOF'
            git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)'
            if [ -z "$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)')" ]; then
              echo "本次发布内容见下方产物与提交记录（建议打附注 tag：git tag -a）。"
            fi
            echo
            if [ -n "$PREV" ]; then
              echo "**Full Changelog**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREV}...${GITHUB_REF_NAME}"
            else
              echo "**Full Changelog**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases"
            fi
            echo 'TINGYU_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          # 显式匹配全部产物；解出的目录名仍是各 artifact 的名字（download-artifact 的默认行为）。
          pattern: '*'
          path: release-artifacts
      - name: Prepare release packages
        run: |
          mkdir -p dist
          # Android APK
          find release-artifacts/tingyu-android -name "*.apk" -exec cp {} dist/tingyu-android.apk \;
          # Linux bundle
          if [ -d release-artifacts/tingyu-linux ]; then
            tar -czf dist/tingyu-linux-x64.tar.gz -C release-artifacts/tingyu-linux .
          fi
          # Windows zip
          if [ -d release-artifacts/tingyu-windows ]; then
            (cd release-artifacts/tingyu-windows && zip -r ../../dist/tingyu-windows-x64.zip .)
          fi
          # macOS zip
          if [ -d release-artifacts/tingyu-macos ]; then
            (cd release-artifacts/tingyu-macos && zip -r ../../dist/tingyu-macos.zip .)
          fi
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # 正文由上面的步骤给出；此时 generate_release_notes 会被 body 覆盖，故不再设置。
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false
