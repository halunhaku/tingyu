name: Flutter

on:
  push:
    # 必须同时写 branches：GitHub 的规则是"只写 tags 不写 branches 时，
    # 分支推送不会触发这个 workflow"。此前只加了 tags，于是 main 上的每次推送
    # 都静默不跑 CI（Actions 里只剩 tag 推送与手动 dispatch），
    # 代码改动等于没有回归网。
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'app/**'
      - 'docs/ui-redesign/p4-quality/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'docs/ui-redesign/p4-quality/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: app

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze + test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Verify approved visual asset seal
        working-directory: .
        run: sha256sum --check docs/ui-redesign/p4-quality/approved-visual-assets.sha256
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      # 测试 job 仍跑在 Linux（纯 Dart/widget 测试）；media_kit 与 flutter_secure_storage
      # 的原生依赖只在编译宿主时用到，但 pub 解析与 test 前的加载保持一致成本最低。
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libmpv-dev libsecret-1-dev \
            ninja-build libgtk-3-dev pkg-config
      - run: flutter pub get
      - name: Format check for P4 changes
        run: dart format --output=none --set-exit-if-changed lib/data/secure_store.dart
      # drift 的 database.g.dart 是提交进仓库的；schema 改了却忘记重新生成，
      # 会在运行时才发现。这里用"重新生成后必须无 diff"来兜底。
      - name: Verify generated drift code is up to date
        run: |
          dart run build_runner build
          git diff --exit-code --stat
      - run: flutter analyze
      # golden 基准图只在本机校验（app/dart_test.yaml 也做了 skip 兜底）；
      # 这里显式排除，避免 CI 引入字体栈差异导致的假失败。
      - run: flutter test --exclude-tags golden

  build:
    name: build (macos)
    needs: analyze
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - run: flutter pub get
      - name: Build
        run: flutter build macos --release
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tingyu-macos
          # 只收产物目录：`**/Release/**` 会把 Build/Intermediates 里的同名目录一起收进来（近 1GB）
          path: app/build/macos/Build/Products/Release/**
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # 发版正文取自附注 tag 的信息，需要完整的 tag 历史（用于自动定位上一个 tag）。
          fetch-depth: 0
      - name: Read tag notes as release body
        id: notes
        run: |
          # 自动生成的 release notes 只列合并进来的 PR；本仓库是直接推 main 的，
          # 生成出来只有一行 compare 链接。改用附注 tag 的信息作为正文，
          # 并自动补上"与上一个 tag 的对比"链接。
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")"
          {
            echo 'body<<TINGYU_NOTES_EOF'
            git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)'
            if [ -z "$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)')" ]; then
              echo "本次发布内容见下方产物与提交记录（建议打附注 tag：git tag -a）。"
            fi
            echo
            if [ -n "$PREV" ]; then
              echo "**Full Changelog**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREV}...${GITHUB_REF_NAME}"
            else
              echo "**Full Changelog**: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases"
            fi
            echo 'TINGYU_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          # 显式匹配全部产物；解出的目录名仍是各 artifact 的名字（download-artifact 的默认行为）。
          pattern: '*'
          path: release-artifacts
      - name: Prepare release packages
        run: |
          mkdir -p dist
          # macOS zip
          if [ -d release-artifacts/tingyu-macos ]; then
            (cd release-artifacts/tingyu-macos && zip -r ../../dist/tingyu-macos.zip .)
          fi
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # 正文由上面的步骤给出；此时 generate_release_notes 会被 body 覆盖，故不再设置。
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: false
