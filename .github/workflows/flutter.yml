name: Flutter

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/flutter.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: app

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze + test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # media_kit / audio_service_mpris / flutter_secure_storage 在 Linux 上需要这些原生依赖才能解析与构建
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libmpv-dev libsecret-1-dev libayatana-appindicator3-dev \
            ninja-build libgtk-3-dev pkg-config
      - run: flutter pub get
      # drift 的 database.g.dart 是提交进仓库的；schema 改了却忘记重新生成，
      # 会在运行时才发现。这里用"重新生成后必须无 diff"来兜底。
      - name: Verify generated drift code is up to date
        run: |
          dart run build_runner build
          git diff --exit-code --stat
      - run: flutter analyze
      - run: flutter test

  build:
    name: build (${{ matrix.name }})
    needs: analyze
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos
            name: macos
            # 只收产物目录：`**/Release/**` 会把 Build/Intermediates 里的同名目录一起收进来（近 1GB）
            artifacts: app/build/macos/Build/Products/Release/**
          - os: windows-2022
            target: windows
            name: windows
            artifacts: app/build/windows/x64/runner/Release/**
          - os: ubuntu-22.04
            target: linux
            name: linux
            artifacts: app/build/linux/x64/release/bundle/**
          - os: ubuntu-22.04
            target: apk
            name: android
            artifacts: app/build/app/outputs/flutter-apk/app-release.apk
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        if: matrix.target == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux native dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libmpv-dev libsecret-1-dev libayatana-appindicator3-dev \
            ninja-build libgtk-3-dev pkg-config
      - run: flutter pub get
      - name: Build
        run: flutter build ${{ matrix.target }} --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tingyu-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Prepare release packages
        run: |
          mkdir -p dist
          # Android APK
          find release-artifacts/tingyu-android -name "*.apk" -exec cp {} dist/tingyu-android.apk \;
          # Linux bundle
          if [ -d release-artifacts/tingyu-linux ]; then
            tar -czf dist/tingyu-linux-x64.tar.gz -C release-artifacts/tingyu-linux .
          fi
          # Windows zip
          if [ -d release-artifacts/tingyu-windows ]; then
            (cd release-artifacts/tingyu-windows && zip -r ../../dist/tingyu-windows-x64.zip .)
          fi
          # macOS zip
          if [ -d release-artifacts/tingyu-macos ]; then
            (cd release-artifacts/tingyu-macos && zip -r ../../dist/tingyu-macos.zip .)
          fi
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
