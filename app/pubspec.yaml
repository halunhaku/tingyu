name: tingyu
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  audio_metadata_reader: ^1.8.0
  audio_service: ^0.18.19
  audio_service_mpris: ^0.2.1
  audio_service_win: ^0.0.3
  audio_session: ^0.2.4
  cached_network_image: ^4.0.0
  dio: ^5.11.1
  drift: ^2.35.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.1.0
  go_router: ^18.0.1
  just_audio: ^0.10.6
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^11.4.0
  # 本地插件：Android SAF 目录授权与枚举（Android 10+ 访问本地音乐的唯一正路）
  tingyu_saf:
    path: packages/tingyu_saf
  xml: ^7.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true

  assets:
    # OpenCC 繁→简单字表（Apache-2.0，https://github.com/BYVoid/OpenCC），
    # 用于把网易云 / LRCLIB 返回的繁体歌词转成简体。
    - assets/opencc/TSCharacters.txt
