name: tingyu
description: "听屿：连接本地文件夹、WebDAV 私人云与夸克网盘的 macOS 音乐播放器。"
publish_to: 'none'
version: 2.0.0-preview+5

environment:
  sdk: ^3.13.2

dependencies:
  audio_metadata_reader: ^1.8.0
  audio_service: ^0.18.19
  cached_network_image: ^4.0.0
  dio: ^5.11.1
  drift: ^2.35.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.1.0
  go_router: ^18.0.1
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  path: ^1.9.1
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1
  xml: ^7.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.2
  sqlite3: ^3.5.2
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true

  assets:
    # OpenCC 繁→简单字表（Apache-2.0，https://github.com/BYVoid/OpenCC），
    # 用于把网易云 / LRCLIB 返回的繁体歌词转成简体。
    - assets/opencc/TSCharacters.txt
